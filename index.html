<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

@media(max-width:1150px){main{grid-template-columns:1fr}}
.card{background:var(--p);border:1px solid var(--l);border-radius:10px;padding:12px;margin-bottom:12px}
h2{margin:0 0 8px;font:600 11px system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--g)}
label{display:block;margin:6px 0;color:var(--m);font-size:12px}label b{float:right;color:var(--t)}
input[type=range]{width:100%}input[type=text],input[type=number],select{background:#080c14;color:var(--t);border:1px solid var(--l);border-radius:5px;padding:4px;width:100%}

button{background:var(--l);color:var(--t);border:0;border-radius:6px;padding:6px 10px;cursor:pointer}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.tabs button.on{background:#e6dcff;color:#111}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:12px;color:var(--m)}.row select{width:auto}.row label{margin:0}
#map{background:#f3f1ec;border-radius:10px;width:100%;height:auto;display:block}
#leg{height:10px;width:200px;border-radius:5px}
#tip{position:fixed;pointer-events:none;background:#000e;padding:6px 8px;border-radius:6px;font-size:12px;display:none;z-index:9;line-height:1.5}
.D{color:var(--d)}.R{color:var(--r)}.sub{font-size:11px;letter-spacing:.1em;color:var(--g);text-transform:uppercase}
.cand{display:grid;grid-template-columns:1fr auto;margin:10px 0;font-size:15px}.cand small{grid-column:1;color:var(--m)}.cand b{grid-row:1/3;grid-column:2;font:600 22px Georgia,serif}
.tag{display:inline-block;border:1px solid var(--l);border-radius:4px;padding:2px 6px;font-size:11px}
.bar{height:14px;display:flex;border-radius:7px;overflow:hidden;margin:8px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px}
.gc{border:1px solid var(--l);border-radius:8px;padding:10px;background:#0c1422}.gc .n{font:600 26px Georgia,serif;color:var(--g)}.gc .k{height:5px;background:#26324a;margin:6px 0}.gc .k i{display:block;height:100%;background:var(--g)}.gc small{color:var(--m);display:block}
.gd{float:right;border:1px solid #7fd6b0;color:#7fd6b0;border-radius:6px;padding:1px 8px;font:600 14px Georgia,serif;letter-spacing:0}
.bk{height:6px;background:#26324a;border-radius:3px}.bk i{display:block;height:100%;background:var(--g);border-radius:3px}
#msg{padding:24px;color:var(--m)}
</style></head><body>
<header><h1>Election Simulator</h1><small>Partisan lean · campaign quality · national environment · turnout · demographics</small></header>
<main>
<div>
 <div class="card"><h2>State</h2><select id="sel"><option value="">United States</option></select><div id="sinfo" style="margin-top:8px;color:var(--m)"></div><div id="sadj"></div></div>

 <div class="card"><h2>Demographic electorate (national)</h2><table id="demo"></table><small id="sum" style="color:var(--m)"></small><br><br><button id="reset">Reset all</button></div>
</div>
<div>
 <div class="card" style="padding:8px">
  <div class="tabs" id="modes"></div>
  <div class="row"><span>View</span><select id="lv"><option value="states">States</option><option value="counties">Counties</option></select><span>Compare with</span><select id="cmp"><option value="2024">2024 actual</option><option value="2020">2020</option></select>
   <label><input type="checkbox" id="arr"> Shift arrows (blue ← D, red → R)</label><div id="leg"></div><span id="legt"></span></div>
  <svg id="map" viewBox="0 0 975 610"><g id="zz"><g id="z"></g><g id="zs"></g></g></svg><div id="msg">Loading…</div>
 </div>

</div>
<div>
 <div class="card" id="rr"></div>
 <div class="card"><h2>Closest states</h2><table id="close"></table></div>
 <div class="card"><h2>Uncertainty</h2><button id="mc">Run 2,000 simulations</button><div id="mcr" style="margin-top:8px"></div></div>
</div></main><div id="tip"></div>

function ingest(a){for(const r of a){if(!r.t)continue;C.set(r.f,{name:r.n,st:r.s,v:r.t,pd:r.d/r.t,pr:r.g/r.t,m0:(r.d-r.g)/r.t*100,m20:r.m2!=null?r.m2:r.t2?(r.d2-r.g2)/r.t2*100:null,s:r.sh,cvap:r.cv})}}
async function live(){
 const U=['https://raw.githubusercontent.com/tonmcg/US_County_Level_Election_Results_08-24/master/','https://cdn.jsdelivr.net/gh/tonmcg/US_County_Level_Election_Results_08-24@master/'];
 const csv=y=>get(U.map(u=>u+y+'_US_County_Level_Presidential_Results.csv'),d3.csv),A='https://api.census.gov/data/2022/acs/acs5?for=county:*&get=';
 const [c24,c20,dm,cv]=await Promise.all([csv(2024),csv(2020),get([A+'B03002_001E,B03002_003E,B03002_004E,B03002_012E,B03002_006E'],d3.json),get([A+'B29001_001E'],d3.json)]);
 if(!c24)return null;
 const p5=s=>String(s).padStart(5,'0'),fp=r=>p5(r.county_fips||r.fips),M={};
 for(const r of c24)M[fp(r)]={f:fp(r),n:r.county_name,s:r.state_name,d:+r.votes_dem,g:+r.votes_gop,t:+(r.total_votes||+r.votes_dem+ +r.votes_gop)};
 if(c20)for(const r of c20){const o=M[fp(r)];if(o){o.d2=+r.votes_dem;o.g2=+r.votes_gop;o.t2=+(r.total_votes||o.d2+o.g2)}}
 if(dm)for(const r of dm.slice(1)){const o=M[r[5]+r[6]],t=+r[0];if(o&&t){const s=[1,2,3,4].map(i=>+r[i]/t);o.sh=[...s,Math.max(0,1-d3.sum(s))]}}
 if(cv)for(const r of cv.slice(1)){const o=M[r[1]+r[2]];if(o)o.cv=+r[0]}
 return Object.values(M)}
async function main(){
 const tp=await get(['data/counties-albers-10m.json','https://cdn.jsdelivr.net/npm/us-atlas@3/counties-albers-10m.json','https://unpkg.com/us-atlas@3/counties-albers-10m.json'],d3.json);
 if(!tp){$('msg').textContent='Could not load county geometry. Open this page from GitHub Pages or a local server (not file://), and make sure scripts/data are not blocked.';return}
 geo=topojson.feature(tp,tp.objects.counties).features;sf=topojson.feature(tp,tp.objects.states).features;sf.forEach(f=>SN[f.id]=f.properties.name);
 $('sel').innerHTML+=sf.map(f=>f.properties.name).sort().map(n=>`<option>${n}</option>`).join('');
 pth=d3.geoPath();geo.forEach(d=>d._c=pth.centroid(d));
 const z=d3.select('#z');svg=d3.select('#map');
 paths=z.selectAll('.c').data(geo).join('path').attr('class','c').attr('d',pth).attr('fill',NA).attr('stroke','#fff').attr('stroke-width',.15);
 const tipFn=(e,d)=>{const c=UV(d),t=$('tip');t.style.display='block';t.style.left=Math.min(e.clientX+12,innerWidth-240)+'px';t.style.top=e.clientY+12+'px';
  t.innerHTML=c?`<b>${LEVEL==='counties'?c.name+', '+c.st:c.name}</b><br><span class=D>${n0(c.vs*c.pdS)} (${(c.pdS*100).toFixed(1)}%)</span> D<br><span class=R>${n0(c.vs*c.prS)} (${(c.prS*100).toFixed(1)}%)</span> R<br>Margin ${fmt(c.m)} · 2024 ${fmt(c.m0)}${c.m20!=null?' · 2020 '+fmt(c.m20):''}<br>${n0(c.vs)} votes${c.cvap?' · turnout '+(c.vs/c.cvap*100).toFixed(1)+'%':''}`:`${SN[d.id.slice(0,2)]||''} (no county data)`};
 const pick=(e,d)=>{SEL=SN[d.id.slice(0,2)]||'';$('sel').value=SEL;selState()},hide=()=>$('tip').style.display='none';
 sf.forEach(d=>d._c=pth.centroid(d));
 sp=d3.select('#zs').selectAll('path').data(sf).join('path').attr('d',pth).attr('fill',NA).attr('stroke','#fff').attr('stroke-width',.5).style('cursor','pointer').on('mousemove',tipFn).on('mouseleave',hide).on('click',pick);
 paths.on('mousemove',tipFn).on('mouseleave',hide).on('click',pick);
 d3.select('#zz').append('path').datum(topojson.mesh(tp,tp.objects.states,(a,b)=>a!==b)).attr('fill','none').attr('stroke','#222').attr('stroke-width',.6).attr('pointer-events','none');
 zm=d3.zoom().scaleExtent([1,14]).on('zoom',e=>d3.select('#zz').attr('transform',e.transform));svg.call(zm);
 $('sel').onchange=()=>{SEL=$('sel').value;selState()};
 $('msg').textContent='Geometry loaded. Loading results…';
 let rows=await get(['data/counties.json'],d3.json);if(!rows||!rows.length)rows=await live();
 if(!rows){const ix=Object.fromEntries(Object.entries(SN).map(([k,v])=>[v,k]));
  rows=ST24.split('\n').map(l=>{const p=l.split(',');return{f:ix[p[0]]+'000',n:p[0],s:p[0],d:+p[1],g:+p[2],t:+p[3],m2:+p[4]}});STATEONLY=true;LEVEL='states';$('lv').value='states';$('lv').querySelector('[value=counties]').disabled=true}
 ingest(rows);if(!C.size){$('msg').textContent='Vote data loaded but no counties parsed.';return}
 NAT=d3.sum([...C.values()],c=>c.v*c.m0)/d3.sum([...C.values()],c=>c.v);
 if(STATEONLY)$('msg').textContent='County data could not be downloaded here (blocked in this preview). Showing real state-level results; counties unlock on GitHub Pages or after running build_data.py and committing data/.';else{LEVEL='counties';$('lv').value='counties';$('msg').remove()}
 upd();
}
$('modes').innerHTML=Object.entries(MODES).map(([k,v])=>`<button data-k=${k} class="${k===MODE?'on':''}">${v}</button>`).join('');
$('modes').onclick=e=>{const k=e.target.dataset.k;if(!k)return;MODE=k;document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));if(C.size)paint()};
$('arr').onchange=$('cmp').onchange=()=>C.size&&paint();
$('lv').onchange=()=>{LEVEL=$('lv').value;if(C.size)paint()};
$('dn').oninput=$('rn').oninput=upd;
$('reset').onclick=()=>{S=init();build();if(paths)selState()};
$('mc').onclick=()=>{const st=Object.entries(ST).filter(([s])=>s!=='US').map(([s,o])=>[o.m,EV[s]||0]);let w=0,tot=0;const N=2000,nr=d3.randomNormal(0,3),sr=d3.randomNormal(0,3.5);
 for(let i=0;i<N;i++){const n=nr(),e=st.reduce((a,[m,v])=>a+(m+n+sr()>0?v:0),0);tot+=e;if(e>=270)w++}
 $('mcr').innerHTML=`<b class=D>${$('dn').value}</b> wins ${(w/N*100).toFixed(1)}% · <b class=R>${$('rn').value}</b> ${(100-w/N*100).toFixed(1)}%<br>Average D electoral votes: ${(tot/N).toFixed(0)}<br><small>σ national 3 pts, state 3.5 pts</small>`};
build();main().catch(e=>{console.error(e);$('msg').textContent='Error: '+e.message});
</script></body></html>
